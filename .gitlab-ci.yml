stages:
  - deploy
  - sonarqube_check

sonarqube_check:
  stage: sonarqube_check
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'    

deploy:
  stage: deploy
  only:
    - main
  script:
    - chmod +x ./deploy.sh
    - ./deploy.sh
